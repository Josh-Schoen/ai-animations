<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Kinetic Fury</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Teko:wght@500;600;700&family=Saira+Condensed:wght@500;700&display=swap" rel="stylesheet" />
<style>
  /* A single dramatic look on purpose: arcade fighter HUD over a night temple. */
  :root {
    color-scheme: dark;
    --ink: #ffffff;
    --ink-2: #e6e1ef;
    --muted: #a79fb8;
    --panel: rgba(10, 6, 16, .78);
    --line: rgba(255, 255, 255, .18);
    --hp: #ffd23f;
    --hp-lo: #ff4d2e;
    --meter: #3fd0ff;
    --display: "Bebas Neue", "Teko", Impact, sans-serif;
    --cond: "Teko", "Saira Condensed", system-ui, sans-serif;
    --sans: "Saira Condensed", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #07040c; color: var(--ink); font: 16px/1.35 var(--sans); user-select: none; -webkit-user-select: none; touch-action: none; }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 3px solid var(--hp); outline-offset: 2px; }

  /* ---------- fight HUD ---------- */
  #hud { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px; z-index: 10; display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: start; pointer-events: none; }
  .pl { display: grid; gap: 4px; min-width: 0; }
  .pl .top { display: flex; align-items: flex-end; gap: 8px; }
  .pl.r .top { flex-direction: row-reverse; }
  .badge { width: 44px; height: 44px; border: 3px solid #000; border-radius: 8px; display: grid; place-items: center; font: 34px/1 var(--display); color: #000; flex: none; box-shadow: 0 0 0 2px rgba(255,255,255,.4); }
  .nm { font: 30px/0.9 var(--display); letter-spacing: .04em; text-shadow: 0 2px 0 #000, 0 0 12px rgba(0,0,0,.6); }
  .nm small { display: block; font: 600 15px var(--cond); letter-spacing: .08em; color: var(--ink-2); }
  .pips { display: flex; gap: 4px; margin-left: auto; padding-bottom: 4px; }
  .pl.r .pips { margin-left: 0; margin-right: auto; }
  .pips i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid #000; background: rgba(255,255,255,.2); }
  .pips i.on { background: var(--hp); box-shadow: 0 0 8px var(--hp); }
  .hpbar { position: relative; height: 22px; border: 3px solid #000; background: #3a0a0a; transform: skewX(-18deg); box-shadow: 0 0 0 1px rgba(255,255,255,.35); overflow: hidden; }
  .pl.r .hpbar { transform: skewX(18deg); }
  .hpbar .lag, .hpbar .fill { position: absolute; top: 0; bottom: 0; right: 0; }
  .pl.r .hpbar .lag, .pl.r .hpbar .fill { right: auto; left: 0; }
  .hpbar .lag { background: #ff2a2a; transition: width .9s .35s; }
  .hpbar .fill { background: linear-gradient(180deg, #fff6b8, var(--hp) 45%, #e6a800); transition: width .08s; }
  .hpbar .fill.low { background: linear-gradient(180deg, #ffc0a8, var(--hp-lo) 45%, #b31c00); animation: throb .5s infinite alternate; }
  @keyframes throb { to { filter: brightness(1.35); } }
  #timer { text-align: center; font: 64px/0.85 var(--display); text-shadow: 0 3px 0 #000, 0 0 16px rgba(255,120,40,.6); min-width: 76px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  #timer small { display: block; font: 600 14px var(--cond); letter-spacing: .14em; color: var(--muted); text-shadow: none; }
  .meters { position: fixed; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; pointer-events: none; width: min(300px, 40vw); }
  #mL { left: 12px; } #mR { right: 12px; text-align: right; }
  .meters .lb { font: 700 15px var(--cond); letter-spacing: .1em; text-shadow: 0 2px 0 #000; }
  .meters .lb b { color: var(--meter); }
  .mbar { height: 12px; border: 2px solid #000; background: rgba(0,0,0,.5); transform: skewX(-18deg); overflow: hidden; margin-top: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.3); }
  #mR .mbar { transform: skewX(18deg); }
  .mbar i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #1a6dff, var(--meter)); transition: width .15s; }
  #mR .mbar i { margin-left: auto; }
  .mbar.full i { background: linear-gradient(90deg, #ff3fd2, #ffe14a, #3fd0ff); background-size: 200% 100%; animation: shimmer .8s linear infinite; box-shadow: 0 0 12px #fff; }
  @keyframes shimmer { to { background-position: -200% 0; } }

  /* ---------- callouts ---------- */
  .call { position: fixed; z-index: 12; pointer-events: none; text-align: center; white-space: nowrap; }
  #big { left: 50%; top: 40%; transform: translate(-50%, -50%); }
  #big .t { font: clamp(64px, 16vw, 180px)/0.85 var(--display); letter-spacing: .02em; color: #fff; -webkit-text-stroke: 3px #000; text-shadow: 0 8px 0 #000, 0 0 40px rgba(255, 90, 30, .8); }
  #big .s { font: 700 clamp(18px, 3.5vw, 30px) var(--cond); letter-spacing: .2em; color: var(--hp); text-shadow: 0 2px 0 #000; }
  #big.pop { animation: bigpop 1.2s ease-out forwards; }
  #big.stay { animation: bigin .35s ease-out forwards; }
  @keyframes bigpop { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); } 14% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 78% { opacity: 1; } 100% { opacity: 0; transform: translate(-50%, -50%) scale(1.05); } }
  @keyframes bigin { 0% { opacity: 0; transform: translate(-50%, -50%) scale(2.2); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
  .side { top: 24%; font: clamp(28px, 5vw, 48px)/0.9 var(--display); -webkit-text-stroke: 2px #000; text-shadow: 0 4px 0 #000; }
  .side small { display: block; font: 700 18px var(--cond); letter-spacing: .12em; -webkit-text-stroke: 0; }
  #comboL { left: 14px; text-align: left; color: #ffd23f; }
  #comboR { right: 14px; text-align: right; color: #ffd23f; }
  #moveL, #moveR { top: 34%; font-size: clamp(22px, 4vw, 38px); color: #fff; }
  #moveL { left: 14px; text-align: left; } #moveR { right: 14px; text-align: right; }
  .side.pop { animation: sidepop 1.3s ease-out forwards; }
  @keyframes sidepop { 0% { opacity: 0; transform: translateX(var(--from, -30px)) scale(1.3); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; } }
  #superFx { position: fixed; inset: 0; z-index: 9; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, transparent 30%, rgba(0,0,0,.75)); transition: opacity .15s; }
  #superFx.on { opacity: 1; }
  #superName { position: fixed; left: 0; right: 0; top: 55%; z-index: 13; pointer-events: none; text-align: center; font: clamp(40px, 9vw, 96px)/1 var(--display); letter-spacing: .04em; color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 6px 0 #000, 0 0 30px var(--glow, #3fd0ff); opacity: 0; }
  #superName.on { animation: supername 1.1s ease-out forwards; }
  @keyframes supername { 0% { opacity: 0; letter-spacing: .5em; } 20% { opacity: 1; letter-spacing: .04em; } 80% { opacity: 1; } 100% { opacity: 0; } }
  #flash { position: fixed; inset: 0; z-index: 11; pointer-events: none; background: #fff; opacity: 0; }

  /* ---------- touch pad ---------- */
  #touch { position: fixed; left: 0; right: 0; bottom: 0; z-index: 14; display: none; justify-content: space-between; align-items: flex-end; padding: 0 12px calc(40px + env(safe-area-inset-bottom, 0px)); pointer-events: none; }
  body.touch #touch { display: flex; }
  body.touch .meters { bottom: calc(4px + env(safe-area-inset-bottom, 0px)); }
  .dpad { position: relative; width: 150px; height: 150px; pointer-events: auto; touch-action: none; border-radius: 50%; background: rgba(10,6,16,.45); border: 2px solid rgba(255,255,255,.2); }
  .dpad i { position: absolute; width: 50px; height: 50px; display: grid; place-items: center; font-style: normal; font-size: 22px; color: rgba(255,255,255,.7); }
  .dpad .u { left: 50px; top: 2px; } .dpad .d { left: 50px; bottom: 2px; } .dpad .l { left: 2px; top: 50px; } .dpad .r { right: 2px; top: 50px; }
  .dpad .knob { position: absolute; left: 50%; top: 50%; width: 56px; height: 56px; margin: -28px 0 0 -28px; border-radius: 50%; background: rgba(255,255,255,.25); border: 2px solid rgba(255,255,255,.5); transition: transform .05s; }
  .btns { display: grid; grid-template-columns: repeat(2, 64px); gap: 10px; pointer-events: auto; }
  .fb { width: 64px; height: 64px; border-radius: 50%; border: 3px solid #000; font: 17px/1 var(--display); letter-spacing: .04em; box-shadow: 0 0 0 2px rgba(255,255,255,.35); touch-action: none; }
  .fb.on { filter: brightness(1.5); transform: scale(.94); }
  .fb.l { background: #3f8cff; } .fb.h { background: #ff4d2e; } .fb.s { background: #ffd23f; color: #000; } .fb.x { background: linear-gradient(135deg, #ff3fd2, #3fd0ff); }

  /* ---------- menus ---------- */
  .ov { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 14px; background: radial-gradient(ellipse at center, rgba(20,6,20,.5), rgba(6,2,10,.9)); overflow-y: auto; }
  .ov[hidden] { display: none; }
  .card { width: min(960px, 100%); text-align: center; }
  .logo { font: clamp(64px, 14vw, 140px)/0.8 var(--display); letter-spacing: .02em; margin: 0; background: linear-gradient(180deg, #fff, #ffd23f 45%, #ff4d2e 70%, #7a0f00); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 6px 0 #000) drop-shadow(0 0 30px rgba(255,80,30,.5)); }
  .tag { font: 700 18px var(--cond); letter-spacing: .3em; color: var(--ink-2); margin: 8px 0 16px; }
  .roster { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
  .fc { text-align: left; border: 3px solid #000; border-radius: 12px; padding: 0; background: var(--panel); overflow: hidden; box-shadow: 0 0 0 2px var(--line); transition: transform .12s, box-shadow .12s; }
  .fc:hover { transform: translateY(-2px); }
  .fc[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--c), 0 0 26px var(--c); }
  .fc .art { height: 118px; position: relative; background: radial-gradient(circle at 50% 110%, var(--c), transparent 70%), #120a1a; display: grid; place-items: end center; overflow: hidden; }
  .fc .art canvas { width: 100%; height: 100%; }
  .fc .art b { position: absolute; left: 10px; top: 6px; font: 40px/1 var(--display); color: #fff; -webkit-text-stroke: 1px #000; text-shadow: 0 3px 0 #000; }
  .fc .art span { position: absolute; left: 11px; top: 42px; font: 600 14px var(--cond); letter-spacing: .1em; color: var(--ink-2); text-shadow: 0 1px 0 #000; }
  .fc .info { padding: 8px 10px 10px; display: grid; gap: 6px; }
  .stat { display: grid; grid-template-columns: 54px 1fr; align-items: center; gap: 6px; font: 600 13px var(--cond); letter-spacing: .08em; color: var(--muted); }
  .stat i { height: 6px; background: rgba(255,255,255,.12); border-radius: 3px; overflow: hidden; }
  .stat i b { display: block; height: 100%; background: var(--c); }
  .moves { font-size: 13px; color: var(--ink-2); display: grid; gap: 2px; }
  .moves div { display: flex; justify-content: space-between; gap: 6px; }
  .moves span:last-child { color: var(--muted); white-space: nowrap; font-family: var(--cond); font-size: 15px; }
  .moves .sup span:first-child { color: #ffd23f; }
  .opts { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .opts button { border: 2px solid var(--line); background: rgba(0,0,0,.4); border-radius: 999px; padding: 4px 16px; font: 600 17px var(--cond); letter-spacing: .08em; color: var(--ink-2); }
  .opts button[aria-pressed="true"] { border-color: var(--hp); color: var(--hp); }
  .go { width: min(420px, 100%); border: 3px solid #000; border-radius: 12px; padding: 10px; font: 40px/1 var(--display); letter-spacing: .06em; color: #1a0800; background: linear-gradient(180deg, #ffe27a, #ff8a1c); box-shadow: 0 5px 0 #000, 0 0 30px rgba(255,120,30,.4); }
  .go:active { transform: translateY(3px); box-shadow: 0 2px 0 #000; }
  .ghost { margin-top: 8px; width: min(420px, 100%); border: 2px solid var(--line); background: rgba(0,0,0,.35); border-radius: 12px; padding: 8px; font: 600 18px var(--cond); letter-spacing: .08em; color: var(--ink-2); }
  .keys { margin-top: 12px; font: 600 16px var(--cond); letter-spacing: .04em; color: var(--muted); }
  .keys b { color: var(--ink); }
  .vs { font: clamp(40px, 9vw, 96px)/1 var(--display); color: #fff; -webkit-text-stroke: 2px #000; text-shadow: 0 6px 0 #000; }
  .vs em { font-style: normal; color: #ff4d2e; padding: 0 .3em; }
  .ladder { display: flex; justify-content: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
  .ladder span { border: 2px solid var(--line); border-radius: 8px; padding: 4px 12px; font: 600 18px var(--cond); letter-spacing: .06em; color: var(--muted); }
  .ladder span.now { border-color: var(--hp); color: var(--hp); }
  .ladder span.beat { color: #6be39a; border-color: #2a6b43; text-decoration: line-through; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #ctl { position: fixed; top: calc(76px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); z-index: 15; display: flex; gap: 6px; }
  #ctl button, #ctl a { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); display: grid; place-items: center; font-size: 13px; color: var(--ink); text-decoration: none; }

  @media (max-width: 760px) {
    .roster { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .fc .moves { display: none; }
    .nm { font-size: 22px; } .nm small { font-size: 12px; }
    .badge { width: 34px; height: 34px; font-size: 26px; }
    #timer { font-size: 46px; min-width: 56px; }
    .hpbar { height: 16px; }
  }
</style>
</head>
<body>
<div id="stage" aria-hidden="true"></div>

<div id="hud" hidden>
  <div class="pl l">
    <div class="top"><div class="badge" id="bdgL">K</div><div class="nm" id="nmL">KAIZEN<small>STORM MONK</small></div><div class="pips" id="pipsL"><i></i><i></i></div></div>
    <div class="hpbar"><div class="lag" id="lagL"></div><div class="fill" id="hpL"></div></div>
  </div>
  <div id="timer">99<small>ROUND 1</small></div>
  <div class="pl r">
    <div class="top"><div class="badge" id="bdgR">V</div><div class="nm" id="nmR" style="text-align:right">VEX<small>INFERNO</small></div><div class="pips" id="pipsR"><i></i><i></i></div></div>
    <div class="hpbar"><div class="lag" id="lagR"></div><div class="fill" id="hpR"></div></div>
  </div>
</div>
<div class="meters" id="mL" hidden><div class="lb">SUPER <b id="mLv">0</b></div><div class="mbar" id="mLb"><i id="mLi"></i></div></div>
<div class="meters" id="mR" hidden><div class="lb">SUPER <b id="mRv">0</b></div><div class="mbar" id="mRb"><i id="mRi"></i></div></div>
<div id="ctl" hidden><button id="bPause" aria-label="Pause (P)" title="Pause (P)">❚❚</button><button id="bSound" aria-label="Sound (M)" title="Sound (M)">🔊</button></div>

<div id="superFx"></div>
<div id="superName"></div>
<div id="flash"></div>
<div class="call" id="big"></div>
<div class="call side" id="comboL"></div><div class="call side" id="comboR"></div>
<div class="call side" id="moveL"></div><div class="call side" id="moveR"></div>
<div class="sr" aria-live="assertive" id="announce"></div>

<div id="touch">
  <div class="dpad" id="dpad" aria-label="Movement pad"><i class="u">▲</i><i class="d">▼</i><i class="l">◀</i><i class="r">▶</i><span class="knob" id="knob"></span></div>
  <div class="btns">
    <button class="fb s" data-b="special" aria-label="Special">SPCL</button><button class="fb x" data-b="super" aria-label="Super">SUPER</button>
    <button class="fb l" data-b="light" aria-label="Light attack">LIGHT</button><button class="fb h" data-b="heavy" aria-label="Heavy attack">HEAVY</button>
  </div>
</div>

<div class="ov" id="select">
  <div class="card">
    <h1 class="logo">KINETIC FURY</h1>
    <div class="tag">CHOOSE YOUR FIGHTER</div>
    <div class="roster" id="roster"></div>
    <div class="opts" role="group" aria-label="CPU difficulty"><button data-d="easy">EASY</button><button data-d="normal" aria-pressed="true">NORMAL</button><button data-d="brutal">BRUTAL</button></div>
    <button class="go" id="bFight">FIGHT</button>
    <div class="keys"><b>A D</b> move · <b>W</b> jump · <b>S</b> crouch · hold <b>back</b> to block · <b>J</b> light · <b>K</b> heavy · <b>L</b> special (+ direction) · <b>I</b> super · or use motions like <b>↓↘→ + J/K</b> · <b>P</b> pause</div>
  </div>
</div>
<div class="ov" id="versus" hidden>
  <div class="card">
    <div class="vs" id="vsLine"></div>
    <div class="ladder" id="ladder"></div>
    <button class="go" id="bVs">FIGHT!</button>
  </div>
</div>
<div class="ov" id="endMatch" hidden>
  <div class="card">
    <div class="vs" id="emTitle"></div>
    <div class="tag" id="emSub"></div>
    <div class="ladder" id="emLadder"></div>
    <button class="go" id="emNext">NEXT CHALLENGER</button><br />
    <button class="ghost" id="emRetry">Rematch</button><br />
    <button class="ghost" id="emMenu">Character select</button>
  </div>
</div>
<div class="ov" id="paused" hidden><div class="card"><div class="vs">PAUSED</div><div class="keys" id="pauseMoves"></div><button class="go" id="bResume">RESUME</button><br /><button class="ghost" id="bQuit">Quit to character select</button></div></div>

<script type="importmap">

</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const D2R = Math.PI / 180;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

/* =====================================================================
   Roster: four original fighters, each with 3 specials + a super.
   Motion notation is relative to facing: 2 = down, 3 = down-forward, 6 = forward, 4 = back, 1 = down-back.
   ===================================================================== */
const N = (o) => Object.assign({ su: 0.1, ac: 0.08, rc: 0.25, dmg: 50, reach: 1.4, height: 'mid', hs: 0.3, bs: 0.18, push: 1.6, kd: false, chip: 0, hits: 1, gap: 0.1 }, o);
const NORMALS = {
  light:  N({ name: 'Jab', su: 0.06, ac: 0.07, rc: 0.13, dmg: 40, reach: 1.45, hs: 0.26, bs: 0.14, pose: 'jab', cancel: true, snd: 'light' }),
  heavy:  N({ name: 'Straight', su: 0.14, ac: 0.08, rc: 0.28, dmg: 95, reach: 1.75, hs: 0.42, bs: 0.24, push: 2.4, pose: 'strong', pre: 'strongWind', cancel: true, snd: 'heavy' }),
  cLight: N({ name: 'Low Jab', su: 0.07, ac: 0.07, rc: 0.15, dmg: 35, reach: 1.55, height: 'low', hs: 0.24, pose: 'cLight', crouch: true, cancel: true, snd: 'light' }),
  cHeavy: N({ name: 'Sweep', su: 0.16, ac: 0.1, rc: 0.42, dmg: 85, reach: 2.05, height: 'low', kd: true, pose: 'sweep', crouch: true, snd: 'heavy' }),
  jLight: N({ name: 'Air Kick', su: 0.06, ac: 0.18, rc: 0.1, dmg: 55, reach: 1.55, height: 'over', hs: 0.34, pose: 'jKick', air: true, snd: 'light' }),
  jHeavy: N({ name: 'Axe Knee', su: 0.1, ac: 0.16, rc: 0.1, dmg: 95, reach: 1.7, height: 'over', hs: 0.45, pose: 'jKnee', air: true, snd: 'heavy' }),
  throw:  N({ name: 'Throw', su: 0.05, ac: 0.05, rc: 0.3, dmg: 130, reach: 1.35, height: 'grab', kd: true, pose: 'grab', grab: true, snd: 'heavy' }),
};
const CHARS = [
  { id: 'kaizen', name: 'KAIZEN', title: 'STORM MONK', color: '#3fb6ff', glow: '#9fe6ff', el: 'lightning',
    body: { skin: '#c98b5e', gi: '#e9eef5', pants: '#1c2a4a', belt: '#101010', acc: 'headband', accColor: '#d62c2c', hair: '#111', scale: 1 },
    hp: 1000, walk: 3.3, stats: { power: 3, speed: 3, range: 4 },
    specials: {

const toonGrad = (() => { const d = new Uint8Array([60, 140, 255]); const t = new THREE.DataTexture(d, 3, 1, THREE.RedFormat); t.minFilter = t.magFilter = THREE.NearestFilter; t.needsUpdate = true; return t; })();
const inkMat = new THREE.MeshBasicMaterial({ color: '#000000', side: THREE.BackSide });
function part(geo, color, parent, outline = 1.07) {
  const m = new THREE.Mesh(geo, new THREE.MeshToonMaterial({ color, gradientMap: toonGrad }));
  const o = new THREE.Mesh(geo, inkMat); o.scale.setScalar(outline); m.add(o);
  parent.add(m); return m;
}

const limbGeo = (r1, r2, len) => { const g = new THREE.CapsuleGeometry((r1 + r2) / 2, len - (r1 + r2), 4, 10); g.translate(0, -len / 2, 0); return g; };
function buildRig(ch) {
  const b = ch.body, s = b.scale, bulk = b.bulk || 1;
  const root = new THREE.Group(); root.scale.setScalar(s);
  const flip = new THREE.Group(); root.add(flip);                // facing (scale.x = ±1)
  const hips = new THREE.Group(); hips.position.y = 1.85; flip.add(hips);
  const spine = new THREE.Group(); hips.add(spine);
  const J = { root, flip, hips, spine };
  // torso
  const torso = part(new THREE.CapsuleGeometry(0.42 * bulk, 0.55, 4, 12), b.gi, spine); torso.position.y = 0.55; torso.scale.set(1, 1, 0.8);
  const chestV = part(new THREE.BoxGeometry(0.5 * bulk, 0.5, 0.2), b.skin, spine, 1.04); chestV.position.set(0.28 * bulk, 0.72, 0); chestV.rotation.z = -0.2; chestV.scale.set(0.5, 1, 1.6);
  const belt = part(new THREE.CylinderGeometry(0.46 * bulk, 0.46 * bulk, 0.18, 14), b.belt, hips, 1.04); belt.position.y = 0.05;
  const pelvis = part(new THREE.CapsuleGeometry(0.36 * bulk, 0.1, 4, 10), b.pants, hips); pelvis.position.y = -0.12; pelvis.scale.set(1, 1, 0.85);
  // head
  const neck = new THREE.Group(); neck.position.y = 1.2; spine.add(neck); J.neck = neck;
  const head = part(new THREE.SphereGeometry(0.3, 16, 12), b.skin, neck); head.position.y = 0.22; head.scale.set(1, 1.12, 0.95);
  const jaw = part(new THREE.BoxGeometry(0.34, 0.2, 0.36), b.skin, neck, 1.05); jaw.position.set(0.06, 0.05, 0);
  const eyeMat = new THREE.MeshBasicMaterial({ color: ch.glow });
  for (const z of [0.12, -0.12]) {
    const e = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.05, 0.1), eyeMat); e.position.set(0.28, 0.27, z); neck.add(e);
    const brow = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.04, 0.16), inkMat.clone()); brow.material.side = THREE.FrontSide; brow.position.set(0.27, 0.34, z); brow.rotation.x = z > 0 ? 0.5 : -0.5; brow.rotation.z = -0.3; neck.add(brow);
  }
  // hair / accessory
  if (b.acc === 'headband') {
    const band = part(new THREE.TorusGeometry(0.3, 0.05, 6, 20), b.accColor, neck, 1.02); band.rotation.x = Math.PI / 2; band.position.y = 0.36;
    const tail = part(new THREE.BoxGeometry(0.5, 0.05, 0.12), b.accColor, neck); tail.position.set(-0.45, 0.34, 0); tail.rotation.z = -0.3; J.tail = tail;
    const hair = part(new THREE.SphereGeometry(0.29, 12, 8, 0, Math.PI * 2, 0, Math.PI / 2), b.hair, neck, 1.03); hair.position.y = 0.3;
  } else if (b.acc === 'mohawk') {
    for (let i = 0; i < 5; i++) { const sp = part(new THREE.ConeGeometry(0.07, 0.42 - Math.abs(i - 2) * 0.05, 5), b.hair, neck, 1.08); sp.position.set(0.18 - i * 0.12, 0.55, 0); sp.rotation.z = 0.35 - i * 0.12; }
  } else if (b.acc === 'horns') {
    for (const z of [0.2, -0.2]) { const h = part(new THREE.ConeGeometry(0.07, 0.45, 6), b.accColor, neck, 1.06); h.position.set(0.05, 0.5, z); h.rotation.x = z > 0 ? 0.6 : -0.6; h.rotation.z = -0.3; }
    const beard = part(new THREE.BoxGeometry(0.2, 0.22, 0.3), b.hair, neck); beard.position.set(0.2, -0.05, 0);
  } else if (b.acc === 'hood') {
    const hood = part(new THREE.SphereGeometry(0.36, 14, 10, Math.PI * 0.35, Math.PI * 1.3), b.accColor, neck, 1.03); hood.position.y = 0.26; hood.rotation.y = Math.PI;
    const mask = part(new THREE.BoxGeometry(0.1, 0.16, 0.42), '#15101c', neck, 1.03); mask.position.set(0.27, 0.12, 0);
    const scarf = part(new THREE.BoxGeometry(0.7, 0.07, 0.16), b.belt, neck); scarf.position.set(-0.5, 0.0, 0); scarf.rotation.z = -0.4; J.tail = scarf;
  }
  // arms (N = near camera, F = far)
  for (const [k, z] of [['N', 0.52 * bulk], ['F', -0.52 * bulk]]) {
    const sh = new THREE.Group(); sh.position.set(0, 1.0, z); spine.add(sh);
    part(new THREE.SphereGeometry(0.2 * bulk, 10, 8), b.gi, sh);
    part(limbGeo(0.14 * bulk, 0.12 * bulk, 0.62), b.skin, sh);
    const el = new THREE.Group(); el.position.y = -0.6; sh.add(el);
    part(limbGeo(0.12 * bulk, 0.1 * bulk, 0.56), b.skin, el);
    const wrap = part(new THREE.CylinderGeometry(0.12 * bulk, 0.12 * bulk, 0.16, 8), '#f2ece0', el, 1.05); wrap.position.y = -0.46;
    const fist = part(new THREE.SphereGeometry(0.15 * bulk, 10, 8), b.skin, el); fist.position.y = -0.62; fist.scale.set(1.1, 1, 1);
    J['sh' + k] = sh; J['el' + k] = el; J['fist' + k] = fist;
  }
  // legs
  for (const [k, z] of [['N', 0.24 * bulk], ['F', -0.24 * bulk]]) {
    const th = new THREE.Group(); th.position.set(0, -0.12, z); hips.add(th);
    part(limbGeo(0.2 * bulk, 0.16 * bulk, 0.86), b.pants, th);

    part(limbGeo(0.16 * bulk, 0.12 * bulk, 0.8), b.pants, kn);
    const foot = part(new THREE.BoxGeometry(0.38, 0.14, 0.2 * bulk), b.acc === 'hood' ? '#111' : b.skin, kn); foot.position.set(0.1, -0.84, 0);

  }

  const aura = new THREE.Sprite(new THREE.SpriteMaterial({ map: glowTex, color: ch.color, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, opacity: 0 }));
  aura.position.y = 2; aura.scale.set(4, 5.5, 1); root.add(aura); J.aura = aura;

  shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.02; J.shadow = shadow;
  scene.add(root); scene.add(shadow);
  return J;
}

}
function buildRoster() {

}
document.querySelectorAll('[data-d]').forEach(b => { b.setAttribute('aria-pressed', b.dataset.d === match.diff); b.onclick = () => { match.diff = b.dataset.d; store.set('kf-diff', match.diff); document.querySelectorAll('[data-d]').forEach(x => x.setAttribute('aria-pressed', x === b)); }; });
$('bFight').onclick = () => { sfx.init(); match.ladder = CHARS.map((_, i) => i).filter(i => i !== match.pick).sort(() => Math.random() - 0.5); match.beaten = []; cpu.level = 0; nextOpponent(); };
function nextOpponent() {
  match.opp = match.ladder.find(i => !match.beaten.includes(i));
  cpu.level = match.beaten.length;
  $('select').hidden = true; $('endMatch').hidden = true;
  $('vsLine').innerHTML = `<span style="color:${CHARS[match.pick].color}">${CHARS[match.pick].name}</span><em>VS</em><span style="color:${CHARS[match.opp].color}">${CHARS[match.opp].name}</span>`;
  $('ladder').innerHTML = renderLadder();
  $('versus').hidden = false; $('bVs').focus();
  setupFighters(match.pick, match.opp);
}
$('bVs').onclick = () => { $('versus').hidden = true; beginMatch(); };
$('emNext').onclick = () => nextOpponent();
$('emRetry').onclick = () => { $('endMatch').hidden = true; setupFighters(match.pick, match.opp); beginMatch(); };
$('emMenu').onclick = () => { $('endMatch').hidden = true; openSelect(); };
function beginMatch() {
  F.forEach(f => f.wins = 0); match.round = 1;
  $('nmL').innerHTML = `${F[0].ch.name}<small>${F[0].ch.title}</small>`; $('nmR').innerHTML = `${F[1].ch.name}<small>${F[1].ch.title}</small>`;
  $('bdgL').textContent = F[0].ch.name[0]; $('bdgL').style.background = F[0].ch.color; $('bdgR').textContent = F[1].ch.name[0]; $('bdgR').style.background = F[1].ch.color;
  hideHud(false);
  $('pauseMoves').innerHTML = ['s1', 's2', 's3', 'sup'].map(k => `<b>${F[0].ch.specials[k].name}</b> ${MOTION_LABEL[F[0].ch.specials[k].motion]} or ${SPECIAL_ALT[k]}`).join('<br />');
  startRound();
}
function setupFighters(a, b) {
  for (const f of F) { scene.remove(f.J.root); scene.remove(f.J.shadow); }
  F = [makeFighter(CHARS[a], 0), makeFighter(CHARS[b], 1)];
  if (a === b) F[1].J.root.traverse(o => { if (o.material?.color && o.material.type === 'MeshToonMaterial') o.material.color.offsetHSL(0.5, 0, -0.1); });
}
function openSelect() {
  match.state = 'select'; hideHud(true);
  $('select').hidden = false; buildRoster(); previewPick();
}
function previewPick() {
  // show your pick vs a random rival shadowboxing behind the menu
  const opp = (match.pick + 1) % CHARS.length;

  F.forEach(f => { f.state = 'idle'; f.pose = 'idle'; });
}
let pausedFrom = null;
function togglePause() {
  if (match.state === 'paused') { match.state = pausedFrom; $('paused').hidden = true; }
  else if (['fight', 'intro'].includes(match.state)) { pausedFrom = match.state; match.state = 'paused'; $('paused').hidden = false; $('bResume').focus(); }
}
$('bPause').onclick = togglePause; $('bResume').onclick = togglePause;
$('bQuit').onclick = () => { $('paused').hidden = true; openSelect(); };
document.addEventListener('visibilitychange', () => { if (document.hidden && match.state === 'fight') togglePause(); });

/* =====================================================================
   Sound (WebAudio synth)
   ===================================================================== */
const sfx = (() => {
  let ctx = null, noise = null, on = store.get('kf-sound') !== 'off';
  const n = (d, f, v, type = 'lowpass', q = 0.7) => { if (!ctx || !on) return; const t = ctx.currentTime, s = ctx.createBufferSource(), fl = ctx.createBiquadFilter(), g = ctx.createGain(); s.buffer = noise; fl.type = type; fl.frequency.value = f; fl.Q.value = q; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); s.connect(fl).connect(g).connect(ctx.destination); s.start(t); s.stop(t + d); };
  const o = (f, d, v, type = 'sine', slide) => { if (!ctx || !on) return; const t = ctx.currentTime, os = ctx.createOscillator(), g = ctx.createGain(); os.type = type; os.frequency.setValueAtTime(f, t); if (slide) os.frequency.exponentialRampToValueAtTime(slide, t + d); g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d); os.connect(g).connect(ctx.destination); os.start(t); os.stop(t + d + 0.02); };
  return {
    init() { if (ctx || !on) return; try { ctx = new (window.AudioContext || window.webkitAudioContext)(); const len = ctx.sampleRate * 2, b = ctx.createBuffer(1, len, ctx.sampleRate), d = b.getChannelData(0); for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1; noise = b; } catch { ctx = null; } },
    light() { n(0.08, 3000, 0.12, 'bandpass', 1); },
    heavy() { n(0.14, 1800, 0.18, 'bandpass', 0.8); },
    whoosh() { n(0.18, 1200, 0.06, 'bandpass', 2); },
    hit() { n(0.1, 2400, 0.35); o(160, 0.12, 0.3, 'sine', 60); },
    smash() { n(0.25, 1400, 0.55); o(110, 0.3, 0.5, 'sine', 35); },
    block() { o(900, 0.05, 0.12, 'square', 500); n(0.05, 4000, 0.15, 'highpass'); },
    thud() { o(70, 0.3, 0.45, 'sine', 30); n(0.2, 400, 0.3); },
    zap() { o(1400, 0.25, 0.08, 'sawtooth', 200); n(0.2, 6000, 0.12, 'highpass'); },
    fire() { n(0.5, 800, 0.4, 'lowpass'); o(90, 0.4, 0.2, 'sawtooth', 50); },
    quake() { o(45, 0.6, 0.6, 'sine', 25); n(0.6, 300, 0.5); },
    call() { o(220, 0.12, 0.08, 'square', 330); },
    gong() { [196, 294, 392].forEach(f => o(f, 1.6, 0.12, 'sine')); n(0.4, 1200, 0.2); },
    superStart() { o(120, 0.8, 0.2, 'sawtooth', 900); n(0.8, 2400, 0.25, 'bandpass', 2); },
    ko() { o(80, 1.8, 0.6, 'sine', 25); n(1.2, 900, 0.5); },
    toggle() { on = !on; store.set('kf-sound', on ? 'on' : 'off'); if (on) this.init(); return on; },
    get on() { return on; },
  };
})();
$('bSound').onclick = () => { $('bSound').textContent = sfx.toggle() ? '🔊' : '🔇'; };
$('bSound').textContent = sfx.on ? '🔊' : '🔇';

/* =====================================================================
   Main loop: fixed 60 Hz simulation, hit-stop, super freeze, slow-mo
   ===================================================================== */
const STEP = 1 / 60;
let acc = 0, last = performance.now(), simT = 0;
const camPos = new THREE.Vector3(0, 3.4, 16);
function frame(ms) {
  const real = Math.min(0.1, (ms - last) / 1000); last = ms;
  const paused = match.state === 'paused';
  if (!paused) acc += real * slowmo;
  while (acc >= STEP) { acc -= STEP; tick(STEP); }
  render(real);
  requestAnimationFrame(frame);
}
function tick(dt) {
  simT += dt;
  const fighting = match.state === 'fight';
  if (freeze > 0) { freeze -= dt; if (freeze <= 0) $('superFx').classList.remove('on'); updateFx(dt); return; }
  if (hitstop > 0) { hitstop -= dt; return; }
  if (fighting) {
    readPlayer(F[0]);
    cpuThink(F[1], simT);
    if (cpu.blockT > 0) cpu.blockT -= dt;
  } else if (F.length) { for (const f of F) { f.intent.h = 0; f.intent.up = 0; f.intent.down = 0; f.intent.press = {}; } }
  if (F.length && match.state !== 'select') {
    for (const f of F) if (f.state !== 'intro' && f.state !== 'win') updateFighter(f, dt, simT);
    if (fighting) cpuFollowUp(F[1]);
    // push boxes: fighters can't overlap on the ground
    const [a, b] = F, dx = b.x - a.x, min = 1.25 * (a.ch.body.scale + b.ch.body.scale) / 2;
    if (Math.abs(dx) < min && Math.abs(a.y - b.y) < 2.4) {

      // pinned against a wall: the other fighter takes all of the push
      if (Math.abs(b.x - a.x) < min - 0.01) { if (Math.abs(a.x) >= STAGE - 0.01) b.x = a.x + s * min; else a.x = b.x - s * min; }

}

  }

}

openSelect();
requestAnimationFrame(frame);
window.KF = { F: () => F, match, press: (b) => { pressed[b] = 1; }, keys, cpu };
